name: PR Standards Automation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [ main, master ]

jobs:
  validate-pr-title:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Enforce: feat(scope): description | fix(scope): description | etc.
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            chore
            hotfix
            perf
            build
          requireScope: false
          ignoreCommits: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title must start with a lowercase letter.
            Example: "feat(client): add multi-monitor selector"

  auto-label:
    name: Auto-Label PR by Branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Label PR by branch prefix
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const labelMap = {
              'feature/': ['enhancement'],
              'feat/':     ['enhancement'],
              'bugfix/':   ['bug'],
              'fix/':      ['bug'],
              'hotfix/':   ['bug', 'critical'],
              'docs/':     ['documentation'],
              'refactor/': ['refactor'],
              'test/':     ['test'],
              'ci/':       ['ci/cd'],
              'chore/':    ['chore'],
              'dependabot/': ['dependencies'],
            };

            const labels = [];
            for (const [prefix, lbls] of Object.entries(labelMap)) {
              if (branch.startsWith(prefix)) {
                labels.push(...lbls);
              }
            }

            if (labels.length > 0) {
              // Create labels if they don't exist yet
              for (const label of labels) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: label === 'bug' ? 'd73a4a' :
                           label === 'critical' ? 'b60205' :
                           label === 'enhancement' ? 'a2eeef' :
                           label === 'documentation' ? '0075ca' :
                           label === 'dependencies' ? '0366d6' :
                           label === 'ci/cd' ? 'e4e669' :
                           label === 'refactor' ? 'f9d0c4' :
                           label === 'test' ? 'c2e0c6' : 'ededed',
                  });
                } catch (e) { /* label already exists, ignore */ }
              }

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels,
                });
              } catch (e) {
                console.log("Skipping auto-labeling due to fork PR token scope restrictions");
              }
            }
