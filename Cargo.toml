[workspace]
resolver = "2"

members = [
    "services/shared",
    "services/identity",
    "services/signaling",
    "services/relay",
    "services/api-gateway",
    "services/audit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Remote Desktop Engineering Team"]
license = "Proprietary"

[workspace.dependencies]
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
